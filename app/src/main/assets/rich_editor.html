<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: #1F1F1F;
    padding: 0;
    background: transparent;
  }

  #editor {
    min-height: 240px;
    padding: 16px;
    outline: none;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  #editor:empty:before {
    content: "写点什么...";
    color: #9E9E9E;
    pointer-events: none;
  }

  #editor h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 12px 0 6px;
    line-height: 1.3;
  }

  #editor h2 {
    font-size: 20px;
    font-weight: 600;
    margin: 10px 0 5px;
    line-height: 1.35;
  }

  #editor h3 {
    font-size: 18px;
    font-weight: 600;
    margin: 8px 0 4px;
    line-height: 1.4;
  }

  #editor p {
    margin: 4px 0;
  }

  #editor ul, #editor ol {
    padding-left: 24px;
    margin: 4px 0;
  }

  #editor li {
    margin: 2px 0;
  }

  #editor blockquote {
    border-left: 3px solid #1A73E8;
    padding-left: 12px;
    margin: 8px 0;
    color: #5F6368;
  }

  #editor img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    margin: 8px 0;
    display: block;
  }

  #editor a {
    color: #1A73E8;
    text-decoration: underline;
  }

  #editor pre {
    background: #F1F3F4;
    border-radius: 8px;
    padding: 12px;
    font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 14px;
    overflow-x: auto;
    margin: 8px 0;
  }

  #editor code {
    background: #F1F3F4;
    border-radius: 4px;
    padding: 1px 4px;
    font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="editor" contenteditable="true"></div>

<script>
  var editor = document.getElementById('editor');
  var isInternalChange = false;
  var debounceTimer = null;

  // ── 通知 Android 内容变化 ──
  function notifyChange() {
    if (isInternalChange) { isInternalChange = false; return; }
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      if (window.RichEditorBridge) {
        window.RichEditorBridge.onContentChanged(editor.innerHTML);
      }
    }, 150);
  }

  editor.addEventListener('input', notifyChange);
  // 粘贴时清除 Word/网页的脏样式
  editor.addEventListener('paste', function(e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  // ── Android → JS 接口 ──

  // 执行格式化命令
  function execFormat(cmd, value) {
    if (value) {
      document.execCommand(cmd, false, value);
    } else {
      document.execCommand(cmd, false, null);
    }
    editor.focus();
    notifyChange();
  }

  // 设置编辑器内容（通过 JSON 传递，避免 escape 问题）
  function setContentFromJson(json) {
    isInternalChange = true;
    try {
      editor.innerHTML = JSON.parse(json);
    } catch(e) {
      editor.innerHTML = json;
    }
  }

  // 设置编辑器内容
  function setContent(html) {
    isInternalChange = true;
    editor.innerHTML = html;
    // 确保空内容占位符
    if (html === '' || html === null) {
      editor.innerHTML = '';
    }
  }

  // 获取编辑器内容
  function getContent() {
    return editor.innerHTML;
  }

  // 插入 Base64 图片
  function insertImageBase64(base64, fileName) {
    var img = '<img src="' + base64 + '" alt="' + (fileName || '图片') + '" />';
    document.execCommand('insertHTML', false, img);
    notifyChange();
  }

  // 通过 URL 插入图片
  function insertImageUrl(url) {
    document.execCommand('insertImage', false, url);
    notifyChange();
  }

  // 获取选中文本
  function getSelectedText() {
    return window.getSelection().toString();
  }

  // 切换只读模式
  function setReadOnly(readOnly) {
    editor.contentEditable = !readOnly;
  }
</script>
</body>
</html>
