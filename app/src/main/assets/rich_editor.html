<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: #000000;
    background: transparent;
  }

  #editor {
    height: 100%;
    padding: 16px;
    outline: none;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  #editor:empty:before {
    content: "写点什么...";
    color: #9E9E9E;
    pointer-events: none;
  }

  #editor h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 12px 0 6px;
    line-height: 1.3;
  }

  #editor h2 {
    font-size: 20px;
    font-weight: 600;
    margin: 10px 0 5px;
    line-height: 1.35;
  }

  #editor h3 {
    font-size: 18px;
    font-weight: 600;
    margin: 8px 0 4px;
    line-height: 1.4;
  }

  #editor p {
    margin: 4px 0;
  }

  #editor ul, #editor ol {
    padding-left: 24px;
    margin: 4px 0;
  }

  #editor li {
    margin: 2px 0;
  }

  #editor blockquote {
    border-left: 3px solid #1A73E8;
    padding-left: 12px;
    margin: 8px 0;
    color: #5F6368;
  }

  #editor img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    margin: 8px 0;
    display: block;
  }

  #editor a {
    color: #1A73E8;
    text-decoration: underline;
  }

  #editor pre {
    background: #F1F3F4;
    border-radius: 8px;
    padding: 12px;
    font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 14px;
    overflow-x: auto;
    margin: 8px 0;
  }

  #editor code {
    background: #F1F3F4;
    border-radius: 4px;
    padding: 1px 4px;
    font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="editor" contenteditable="true"></div>

<script>
  var editor = document.getElementById('editor');
  var isInternalChange = false;
  var debounceTimer = null;
  var selTimer = null;

  function notifyChange() {
    if (isInternalChange) { isInternalChange = false; return; }
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      if (window.RichEditorBridge) {
        window.RichEditorBridge.onContentChangedJs(editor.innerHTML);
      }
    }, 50);
  }

  editor.addEventListener('input', notifyChange);
  editor.addEventListener('paste', function(e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  // ── 格式化命令 ──
  function execFormat(cmd, value) {
    // fontSize：段落级，设所在块元素（LI/P/DIV/H1-6），序号自然跟随
    if (cmd === 'fontSize' && value) {
      var sel = window.getSelection();
      if (sel.rangeCount > 0) {
        var rng = sel.getRangeAt(0);
        var block = rng.commonAncestorContainer;
        while (block && block.nodeType !== 1) block = block.parentNode;
        while (block && block !== editor && !/^(P|DIV|H[1-6]|LI|BLOCKQUOTE|BODY)$/.test(block.nodeName)) {
          block = block.parentNode;
        }
        if (!block || block === editor || block.nodeName === 'BODY') {
          document.execCommand('formatBlock', false, '<p>');
          block = sel.getRangeAt(0).startContainer;
          while (block && block.nodeType !== 1) block = block.parentNode;
          while (block && block !== editor && block.nodeName !== 'P') block = block.parentNode;
        }
        if (!block || block === editor) block = editor;
        var fpx2 = parseInt(value);
        if (block.nodeName === 'LI' && fpx2 > 36) value = '36px';
        block.style.fontSize = value;
      }
      editor.focus();
      notifyChange();
      setTimeout(queryFormatState, 20);
      return;
    }
    if (cmd === 'foreColor' && value) {
      document.execCommand('styleWithCSS', false, true);
      document.execCommand(cmd, false, value);
      document.execCommand('styleWithCSS', false, false);
    } else if (value) {
      document.execCommand(cmd, false, value);
    } else {
      document.execCommand(cmd, false, null);
    }
    if (cmd === 'insertUnorderedList' || cmd === 'insertOrderedList') updateListStyle();
    editor.focus();
    notifyChange();
    setTimeout(queryFormatState, 20);
  }

  // 设置编辑器内容（通过 JSON 传递，避免 escape 问题）
  function setContentFromJson(json) {
    isInternalChange = true;
    try {
      editor.innerHTML = JSON.parse(json);
    } catch(e) {
      editor.innerHTML = json;
    }
    isInternalChange = false;
  }

  // 设置编辑器内容
  function setContent(html) {
    isInternalChange = true;
    editor.innerHTML = html;
    // 确保空内容占位符
    if (html === '' || html === null) {
      editor.innerHTML = '';
    }
  }

  // 获取编辑器内容
  function getContent() {
    return editor.innerHTML;
  }

  // 插入 Base64 图片
  function insertImageBase64(base64, fileName) {
    var img = '<img src="' + base64 + '" alt="' + (fileName || '图片') + '" />';
    document.execCommand('insertHTML', false, img);
    notifyChange();
  }

  // 对齐（直接设块级元素 style.textAlign，列表穿透到 OL/UL 让序号跟随）
  function applyAlignment(align) {
    try {
      var sel = window.getSelection();
      if (sel.rangeCount === 0) return;
      var node = sel.getRangeAt(0).startContainer;
      while (node && node.nodeType !== 1) node = node.parentNode;
      var origin = sel.getRangeAt(0).startContainer;
      while (node && node !== editor && !/^(P|DIV|H[1-6]|UL|OL|LI|BLOCKQUOTE|BODY)$/.test(node.nodeName)) {
        node = node.parentNode;
      }
      if (!node || node === editor || node.nodeName === 'BODY') {
        document.execCommand('formatBlock', false, 'div');
        var rng = window.getSelection().getRangeAt(0);
        var n = rng.startContainer;
        while (n && n.nodeType !== 1) n = n.parentNode;
        while (n && n !== editor && !/^(P|DIV|H[1-6])$/.test(n.nodeName)) n = n.parentNode;
        if (n && n !== editor) n.style.textAlign = align;
      } else {
        if (node.nodeName === 'LI') node = node.parentNode;
        if (node) {
          node.style.textAlign = align;
          if (/^(UL|OL)$/.test(node.nodeName)) {
            node.style.listStylePosition = (align === 'left') ? 'outside' : 'inside';
          }
        }
      }
    } catch(e) {}
    editor.focus();
    notifyChange();
    setTimeout(queryFormatState, 30);
  }

  // 通过 URL 插入图片
  function insertImageUrl(url) {
    document.execCommand('insertImage', false, url);
    notifyChange();
  }

  // 有序列表类型切换（已在 OL 中直接改 type，同类型则 toggle 取消）
  function changeOrderedListType(type) {
    try {
      var range = window.getSelection().getRangeAt(0);
      var node = range.startContainer;
      while (node && node.nodeName !== 'OL') node = node.parentNode;
      if (node && node.nodeName === 'OL') {
        var cur = node.getAttribute('type') || '1';
        if (cur === type) {
          // 同类型 → toggle 取消列表
          document.execCommand('insertOrderedList', false, null);
        } else {
          node.setAttribute('type', type);
        }
      } else {
        document.execCommand('insertOrderedList', false, null);
        var newNode = window.getSelection().getRangeAt(0).startContainer;
        while (newNode && newNode.nodeName !== 'OL') newNode = newNode.parentNode;
        if (newNode) newNode.setAttribute('type', type);
      }
    } catch(e) {
      document.execCommand('insertOrderedList', false, null);
    }
    updateListStyle();
    editor.focus();
    notifyChange();
    setTimeout(queryFormatState, 30);
  }

  // 根据当前对齐方向更新所有列表的 listStylePosition
  function updateListStyle() {
    try {
      var node = window.getSelection().getRangeAt(0).startContainer;
      while (node && node.nodeType !== 1) node = node.parentNode;
      while (node && node !== editor && !/^(P|DIV|H[1-6]|LI|UL|OL|BODY)$/.test(node.nodeName)) node = node.parentNode;
      if (!node || node === editor || node.nodeName === 'BODY') return;
      var align = node.style.textAlign || 'left';
      var lists = editor.querySelectorAll('ul, ol');
      for (var i = 0; i < lists.length; i++) {
        // 如果列表本身或其父容器有 textAlign，用那个；否则用当前段的
        var listAlign = lists[i].style.textAlign || (lists[i].parentNode.style.textAlign || align);
        lists[i].style.listStylePosition = (listAlign === 'left') ? 'outside' : 'inside';
      }
    } catch(e) {}
  }

  // 查询当前格式状态，通过 callback 返回 JSON
  function queryFormatState() {
    var state = {
      bold: document.queryCommandState('bold'),
      italic: document.queryCommandState('italic'),
      underline: document.queryCommandState('underline'),
      strikeThrough: document.queryCommandState('strikeThrough'),
      insertUnorderedList: document.queryCommandState('insertUnorderedList'),
      insertOrderedList: document.queryCommandState('insertOrderedList')
    };
    // alignment: detect from CSS textAlign (applyAlignment sets style directly)
    state.justifyLeft = true; state.justifyCenter = false; state.justifyRight = false;
    try {
      var aNode = window.getSelection().getRangeAt(0).startContainer;
      while (aNode && aNode.nodeType !== 1) aNode = aNode.parentNode;
      while (aNode && aNode !== editor && !/^(P|DIV|H[1-6]|UL|OL|LI|BLOCKQUOTE|BODY)$/.test(aNode.nodeName)) {
        aNode = aNode.parentNode;
      }
      if (aNode && aNode.nodeName === 'LI') aNode = aNode.parentNode;
      if (aNode && aNode !== editor && aNode.nodeName !== 'BODY') {
        var ta = aNode.style.textAlign || '';
        state.justifyLeft = (ta === 'left');
        state.justifyCenter = (ta === 'center');
        state.justifyRight = (ta === 'right');
      }
    } catch(e) {}
    // fontSize: 从块级 CSS 读取
    try {
      var fn = window.getSelection().getRangeAt(0).startContainer;
      while (fn && fn.nodeType !== 1) fn = fn.parentNode;
      if (fn) { var fcs = window.getComputedStyle(fn); state.fontSize = parseInt(fcs.fontSize) + 'px'; }
    } catch(e) {}
    // foreColor: CSS 反查
    try {
      var n = window.getSelection().getRangeAt(0).startContainer;
      while (n && n.nodeType !== 1) n = n.parentNode;
      if (n) { var qcv = document.queryCommandValue('foreColor'); state.foreColor = (qcv && qcv !== 'rgb(0, 0, 0)') ? qcv : (window.getComputedStyle(n).color || ''); }
    } catch(e) {}
    // 检查 ordered list 的 type 属性
    try {
      var node = window.getSelection().getRangeAt(0).startContainer;
      while (node && node.nodeName !== 'OL') node = node.parentNode;
      if (node) {
        var t = node.getAttribute('type') || '1';
        state.orderedListType = t;
      }
    } catch(e) { state.orderedListType = '1'; }
    if (window.RichEditorBridge) {
      window.RichEditorBridge.onFormatStateJs(JSON.stringify(state));
    }
  }

  // 选择变化时更新格式状态（光标移动/拖选文本时高亮对应按键）
  document.addEventListener('selectionchange', function() {
    if (document.activeElement === editor || editor.contains(document.activeElement)) {
      if (selTimer) clearTimeout(selTimer);
      selTimer = setTimeout(queryFormatState, 20);
    }
  });

  // 获取选中文本
  function getSelectedText() {
    return window.getSelection().toString();
  }

  // 切换只读模式
  function setReadOnly(readOnly) {
    editor.contentEditable = !readOnly;
  }
</script>
</body>
</html>
