# ============================================================
# Gradle 属性 — 编译和性能相关配置
# ============================================================

# 启用 AndroidX（新版支持库，替代老旧的 Support Library）
android.useAndroidX=true

# Kotlin 代码风格：official = Kotlin 官方推荐的风格
kotlin.code.style=official

# nonTransitiveRClass：每个模块只生成自己 R 类的常量，
# 不包含依赖模块的 R 类引用。减少 R 类体积，加快编译。
android.nonTransitiveRClass=true

# Gradle 守护进程最大堆内存（2GB）
org.gradle.jvmargs=-Xmx2048m

# 允许路径中包含非 ASCII 字符（如中文目录名）。
# AGP 默认检查路径必须是纯 ASCII，这里跳过检查。
android.overridePathCheck=true
